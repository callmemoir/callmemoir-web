<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALL ME.MOIR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #F4EBE2;
      color: #F0E5D8;
      font-family: Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PAGE 1: Layar TV Interaktif + Semua Sparkle Bergerak */
    #page-1 {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      background-color: #F4EBE2;
    }

    .tv-stage {
      position: relative;
      width: 100%;
      max-width: 1020px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      background-color: #F4EBE2;
    }

    .tv-stage img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Semua sparkle (besar & kecil) aktif bergerak */
    .sparkle-star {
      position: absolute;
      pointer-events: none;
      transform-origin: center center;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.95))
              drop-shadow(0 0 22px rgba(255, 240, 210, 0.8));
      will-change: transform, opacity;
    }

    .star-big-right {
      top: 21%;
      left: 66.5%;
      width: clamp(36px, 5.4vw, 66px);
      height: clamp(36px, 5.4vw, 66px);
      animation: sparkleBigMove 2.2s infinite ease-in-out;
      animation-delay: 0s;
    }

    .star-big-left {
      top: 63%;
      left: 16.5%;
      width: clamp(32px, 4.8vw, 58px);
      height: clamp(32px, 4.8vw, 58px);
      animation: sparkleBigMove 2.4s infinite ease-in-out;
      animation-delay: 0.7s;
    }

    .star-med-top {
      top: 25%;
      left: 73.5%;
      width: clamp(20px, 3vw, 36px);
      height: clamp(20px, 3vw, 36px);
      animation: sparkleSmallMove 1.7s infinite ease-in-out;
      animation-delay: 0.35s;
    }

    .star-sm-bottom {
      top: 57%;
      left: 24.5%;
      width: clamp(16px, 2.4vw, 28px);
      height: clamp(16px, 2.4vw, 28px);
      animation: sparkleSmallMove 1.9s infinite ease-in-out;
      animation-delay: 1.1s;
    }

    .star-sm-top-left {
      top: 19%;
      left: 23.5%;
      width: clamp(16px, 2.3vw, 26px);
      height: clamp(16px, 2.3vw, 26px);
      animation: sparkleSmallMove 2.1s infinite ease-in-out;
      animation-delay: 0.5s;
    }

    @keyframes sparkleBigMove {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.65) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.28) rotate(22deg);
      }
    }

    @keyframes sparkleSmallMove {
      0%, 100% {
        opacity: 0.1;
        transform: scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.22) rotate(-18deg);
      }
    }

    /* Area klik tepat di layar TV */
    .tv-screen-trigger {
      position: absolute;
      top: 23%;
      left: 24.2%;
      width: 47.8%;
      height: 61.5%;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 18px;
      -webkit-tap-highlight-color: transparent;
    }

    /* PAGE 2: Halaman Utama / Bio */
    #page-2 {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 56px;
      background-color: #F4EBE2;
      animation: fadeEnter 0.55s ease forwards;
    }

    #page-2.active {
      display: flex;
    }

    .bio-sheet {
      position: relative;
      width: 100%;
      max-width: 780px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      background-color: #F4EBE2;
    }

    .bio-sheet img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Hotspot link area Contact us di bagian bawah Page 2 */
    .contact-link {
      position: absolute;
      display: block;
      border-radius: 6px;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(240, 229, 216, 0.25);
      transition: background-color 0.2s ease;
    }

    .contact-link:hover {
      background-color: rgba(240, 229, 216, 0.14);
    }

    /* Kolom kiri: Instagram, Facebook, Threads */
    .link-instagram {
      top: 78.2%;
      left: 6%;
      width: 41%;
      height: 1.5%;
    }

    .link-facebook {
      top: 80.1%;
      left: 6%;
      width: 41%;
      height: 1.5%;
    }

    .link-threads {
      top: 82.0%;
      left: 6%;
      width: 41%;
      height: 1.5%;
    }

    /* Kolom kanan: TikTok, Email */
    .link-tiktok {
      top: 78.2%;
      left: 50%;
      width: 44%;
      height: 1.5%;
    }

    .link-email {
      top: 80.1%;
      left: 50%;
      width: 45%;
      height: 1.5%;
    }

    .back-tv-btn {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(240, 229, 216, 0.45);
      background-color: rgba(74, 24, 22, 0.92);
      color: #F0E5D8;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .back-tv-btn:hover {
      transform: translateY(-2px);
    }

    @keyframes fadeEnter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- PAGE 1 -->
  <main id="page-1" aria-label="Welcome Screen">
    <div class="tv-stage">
      <img src="page-1-welcome.png" alt="CALL ME.MOIR - Memories Not Found" />

      <svg style="display:none" aria-hidden="true">
        <defs>
          <path id="four-point-star" d="M50 2 C54 32, 68 46, 98 50 C68 54, 54 68, 50 98 C46 68, 32 54, 2 50 C32 46, 46 32, 50 2 Z" />
        </defs>
      </svg>

      <svg class="sparkle-star star-big-right" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFFFF" />
      </svg>
      <svg class="sparkle-star star-big-left" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFFFF" />
      </svg>
      <svg class="sparkle-star star-med-top" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFDF9" />
      </svg>
      <svg class="sparkle-star star-sm-bottom" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFDF9" />
      </svg>
      <svg class="sparkle-star star-sm-top-left" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFDF9" />
      </svg>

      <button
        type="button"
        class="tv-screen-trigger"
        id="enterTvBtn"
        aria-label="Masuk ke halaman utama CALL ME.MOIR"
        title="Klik layar TV untuk masuk"
      ></button>
    </div>
  </main>

  <!-- PAGE 2 -->
  <section id="page-2" aria-label="CALL ME.MOIR Bio & Packages">
    <div class="bio-sheet">
      <img src="page-2-bio.png" alt="CALL ME.MOIR - Audio Video Guestbook Bio" />

      <!-- Link Sosial Media & Email di bagian Contact us -->
      <a
        href="https://www.instagram.com/callme.moir/"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-link link-instagram"
        aria-label="Instagram CALL ME.MOIR"
        title="Buka Instagram @callme.moir"
      ></a>

      <a
        href="https://www.facebook.com/callme.moir"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-link link-facebook"
        aria-label="Facebook CALL ME.MOIR"
        title="Buka Facebook @callme.moir"
      ></a>

      <a
        href="https://www.threads.net/@callme.moir"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-link link-threads"
        aria-label="Threads CALL ME.MOIR"
        title="Buka Threads @callme.moir"
      ></a>

      <a
        href="https://www.tiktok.com/@callme.moir"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-link link-tiktok"
        aria-label="TikTok CALL ME.MOIR"
        title="Buka TikTok @callme.moir"
      ></a>

      <a
        href="mailto:callme.moir@gmail.com"
        class="contact-link link-email"
        aria-label="Email CALL ME.MOIR"
        title="Kirim email ke callme.moir@gmail.com"
      ></a>
    </div>

    <button type="button" class="back-tv-btn" id="backTvBtn" aria-label="Kembali ke layar TV">
      ↩ Layar TV
    </button>
  </section>

  <script>
    const page1 = document.getElementById("page-1");
    const page2 = document.getElementById("page-2");
    const enterTvBtn = document.getElementById("enterTvBtn");
    const backTvBtn = document.getElementById("backTvBtn");

    enterTvBtn.addEventListener("click", () => {
      page2.classList.add("active");
      page1.style.display = "none";
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    backTvBtn.addEventListener("click", () => {
      page1.style.display = "flex";
      page2.classList.remove("active");
      window.scrollTo({ top: 0, behavior: "instant" });
    });
  </script>
</body>
</html>
