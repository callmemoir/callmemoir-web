<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALL ME.MOIR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F4EBE2;
      color: #F0E5D8;
      font-family: Georgia, serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      gap: 24px;
      min-height: 100vh;
    }

    .page-frame {
      width: 100%;
      max-width: 960px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      background-color: #F4EBE2;
    }

    .page-frame img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <section class="page-frame">
    <img src="images/page-1-welcome.png" alt="CALL ME.MOIR - Welcome">
  </section>

  <section class="page-frame">
    <img src="images/page-2-bio.png" alt="CALL ME.MOIR - Bio">
  </section>
</body>
</html>
