<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALL ME.MOIR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #F4EBE2;
      color: #F0E5D8;
      font-family: Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PAGE 1: Layar TV Interaktif + Sparkle Baru */
    #page-1 {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      background-color: #F4EBE2;
    }

    .tv-stage {
      position: relative;
      width: 100%;
      max-width: 1020px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      background-color: #F4EBE2;
    }

    .tv-stage img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Sparkle baru: lembut, tidak menimpa teks utama */
    .sparkle {
      position: absolute;
      pointer-events: none;
      color: #FFFDF9;
      text-shadow: 0 0 10px rgba(255, 250, 240, 0.9), 0 0 20px rgba(255, 238, 210, 0.65);
      animation: softBlink 2.6s infinite ease-in-out;
    }

    .sparkle-a {
      top: 19.5%;
      left: 72.2%;
      font-size: clamp(16px, 2.2vw, 28px);
      animation-delay: 0s;
    }

    .sparkle-b {
      top: 78%;
      left: 22.8%;
      font-size: clamp(14px, 1.9vw, 24px);
      animation-delay: 0.9s;
    }

    .sparkle-c {
      top: 14%;
      left: 26.5%;
      font-size: clamp(12px, 1.5vw, 18px);
      animation-delay: 1.6s;
    }

    @keyframes softBlink {
      0%, 100% {
        opacity: 0.08;
        transform: scale(0.75) rotate(0deg);
      }
      50% {
        opacity: 0.85;
        transform: scale(1.12) rotate(10deg);
      }
    }

    /* Area klik tepat di layar TV */
    .tv-screen-trigger {
      position: absolute;
      top: 23%;
      left: 24.2%;
      width: 47.8%;
      height: 61.5%;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 18px;
      -webkit-tap-highlight-color: transparent;
    }

    /* PAGE 2: Halaman Utama / Bio */
    #page-2 {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 56px;
      background-color: #F4EBE2;
      animation: fadeEnter 0.55s ease forwards;
    }

    #page-2.active {
      display: flex;
    }

    .bio-sheet {
      width: 100%;
      max-width: 780px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      background-color: #F4EBE2;
    }

    .bio-sheet img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back-tv-btn {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(240, 229, 216, 0.45);
      background-color: rgba(74, 24, 22, 0.92);
      color: #F0E5D8;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .back-tv-btn:hover {
      transform: translateY(-2px);
    }

    @keyframes fadeEnter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- PAGE 1 -->
  <main id="page-1" aria-label="Welcome Screen">
    <div class="tv-stage">
      <img src="page-1-welcome.png" alt="CALL ME.MOIR - Memories Not Found" />

      <!-- Sparkle baru berkedip lembut -->
      <span class="sparkle sparkle-a" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-b" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-c" aria-hidden="true">✦</span>

      <button
        type="button"
        class="tv-screen-trigger"
        id="enterTvBtn"
        aria-label="Masuk ke halaman utama CALL ME.MOIR"
        title="Klik layar TV untuk masuk"
      ></button>
    </div>
  </main>

  <!-- PAGE 2 -->
  <section id="page-2" aria-label="CALL ME.MOIR Bio & Packages">
    <div class="bio-sheet">
      <img src="page-2-bio.png" alt="CALL ME.MOIR - Audio Video Guestbook Bio" />
    </div>
    <button type="button" class="back-tv-btn" id="backTvBtn" aria-label="Kembali ke layar TV">
      ↩ Layar TV
    </button>
  </section>

  <script>
    const page1 = document.getElementById("page-1");
    const page2 = document.getElementById("page-2");
    const enterTvBtn = document.getElementById("enterTvBtn");
    const backTvBtn = document.getElementById("backTvBtn");

    enterTvBtn.addEventListener("click", () => {
      page2.classList.add("active");
      page1.style.display = "none";
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    backTvBtn.addEventListener("click", () => {
      page1.style.display = "flex";
      page2.classList.remove("active");
      window.scrollTo({ top: 0, behavior: "instant" });
    });
  </script>
</body>
</html>
