<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CALL ME.MOIR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #F4EBE2;
      color: #F0E5D8;
      font-family: Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PAGE 1: Layar TV Interaktif Full-Screen (Landscape & Portrait) */
    #page-1 {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #d7dadf 0%, #eae3d8 52%, #efe0cc 100%);
    }

    .tv-stage {
      position: relative;
      width: 100%;
      max-width: 1120px;
      border-radius: 0;
      overflow: visible;
      box-shadow: none;
      background: transparent;
      transform: none;
      transition: transform 0.3s ease;
    }

    .tv-stage img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      -webkit-mask-image: radial-gradient(ellipse 98% 95% at 50% 50%, #000 80%, transparent 100%);
      mask-image: radial-gradient(ellipse 98% 95% at 50% 50%, #000 80%, transparent 100%);
    }

    /* Semua sparkle (besar & kecil) aktif bergerak */
    .sparkle-star {
      position: absolute;
      pointer-events: none;
      transform-origin: center center;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.95))
              drop-shadow(0 0 22px rgba(255, 240, 210, 0.8));
      will-change: transform, opacity;
      z-index: 4;
    }

    .star-big-right {
      top: 21%;
      left: 66.5%;
      width: clamp(36px, 5.4vw, 66px);
      height: clamp(36px, 5.4vw, 66px);
      animation: sparkleBigMove 2.2s infinite ease-in-out;
      animation-delay: 0s;
    }

    .star-big-left {
      top: 63%;
      left: 16.5%;
      width: clamp(32px, 4.8vw, 58px);
      height: clamp(32px, 4.8vw, 58px);
      animation: sparkleBigMove 2.4s infinite ease-in-out;
      animation-delay: 0.7s;
    }

    .star-med-top {
      top: 25%;
      left: 73.5%;
      width: clamp(20px, 3vw, 36px);
      height: clamp(20px, 3vw, 36px);
      animation: sparkleSmallMove 1.7s infinite ease-in-out;
      animation-delay: 0.35s;
    }

    .star-sm-bottom {
      top: 57%;
      left: 24.5%;
      width: clamp(16px, 2.4vw, 28px);
      height: clamp(16px, 2.4vw, 28px);
      animation: sparkleSmallMove 1.9s infinite ease-in-out;
      animation-delay: 1.1s;
    }

    .star-sm-top-left {
      top: 19%;
      left: 23.5%;
      width: clamp(16px, 2.3vw, 26px);
      height: clamp(16px, 2.3vw, 26px);
      animation: sparkleSmallMove 2.1s infinite ease-in-out;
      animation-delay: 0.5s;
    }

    /* Area klik tepat di layar TV halaman 1 */
    .tv-screen-trigger {
      position: absolute;
      z-index: 6;
      top: 23%;
      left: 24.2%;
      width: 47.8%;
      height: 61.5%;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 18px;
      -webkit-tap-highlight-color: transparent;
    }

    /* Petunjuk halus di bagian bawah layar Page 1 */
    .tap-hint {
      position: absolute;
      bottom: clamp(24px, 4.5vh, 42px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      color: rgba(114, 48, 42, 0.84);
      font-family: Georgia, serif;
      font-size: clamp(11px, 1.4vw, 13.5px);
      letter-spacing: 1.4px;
      text-transform: uppercase;
      pointer-events: none;
      white-space: nowrap;
      animation: hintPulse 2.4s infinite ease-in-out;
    }

    /* Penyesuaian khusus mode Portrait (HP / Tablet vertikal) */
    @media (orientation: portrait) {
      #page-1 {
        background: linear-gradient(160deg, #d8dbe0 0%, #ebe4d9 48%, #f0e1cd 100%);
      }

      .tv-stage {
        width: 100%;
        max-width: 100%;
        transform: translateY(-4%);
      }

      .tap-hint {
        bottom: auto;
        top: 63.5%;
        font-size: clamp(13.5px, 4.1vw, 17.5px);
        letter-spacing: 1.7px;
      }
    }

    @keyframes hintPulse {
      0%, 100% {
        opacity: 0.45;
      }
      50% {
        opacity: 0.95;
      }
    }

    @keyframes sparkleBigMove {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.65) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.28) rotate(22deg);
      }
    }

    @keyframes sparkleSmallMove {
      0%, 100% {
        opacity: 0.1;
        transform: scale(0.6) rotate(0deg);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.22) rotate(-18deg);
      }
    }

    /* PAGE 2: Halaman Utama / Bio */
    #page-2 {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding: 0;
      background-color: #F4EBE2;
      animation: fadeEnter 0.55s ease forwards;
    }

    #page-2.active {
      display: flex;
    }

    .bio-sheet {
      position: relative;
      width: 100%;
      max-width: 820px;
      min-height: 420px;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
      background-color: #F4EBE2;
    }

    .bio-sheet img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Hotspot transparan murni tepat di atas tulisan kontak */
    .contact-hotspot {
      position: absolute;
      z-index: 10;
      display: block;
      background: transparent;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(240, 229, 216, 0.18);
    }

    .contact-hotspot:active {
      background-color: rgba(240, 229, 216, 0.14);
    }

    /* Kolom kiri: INSTAGRAM, FACEBOOK, THREADS */
    .hotspot-instagram {
      top: 66.8%;
      left: 6%;
      width: 39%;
      height: 1.05%;
    }

    .hotspot-facebook {
      top: 67.85%;
      left: 6%;
      width: 39%;
      height: 1.05%;
    }

    .hotspot-threads {
      top: 68.9%;
      left: 6%;
      width: 39%;
      height: 1.05%;
    }

    /* Kolom kanan: TIKTOK, EMAIL, WA */
    .hotspot-tiktok {
      top: 66.8%;
      left: 47.5%;
      width: 35%;
      height: 1.05%;
    }

    .hotspot-email {
      top: 67.85%;
      left: 47.5%;
      width: 47%;
      height: 1.05%;
    }

    .hotspot-wa {
      top: 68.9%;
      left: 47.5%;
      width: 37%;
      height: 1.05%;
    }

    /* Area klik tepat di layar TV bagian TUTORIAL */
    .tutorial-tv-hotspot {
      position: absolute;
      z-index: 10;
      top: 89.2%;
      left: 33.5%;
      width: 28.5%;
      height: 6.2%;
      display: block;
      background: transparent;
      border: none;
      border-radius: 12px;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(116, 40, 34, 0.14);
    }

    .tutorial-tv-hotspot:active {
      background-color: rgba(116, 40, 34, 0.12);
    }

    /* Tombol kembali bertuliskan Welcome */
    .back-tv-btn {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(240, 229, 216, 0.45);
      background-color: rgba(74, 24, 22, 0.92);
      color: #F0E5D8;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .back-tv-btn:hover {
      transform: translateY(-2px);
    }

    @keyframes fadeEnter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- PAGE 1 -->
  <main id="page-1" aria-label="Welcome Screen">
    <div class="tv-stage">
      <img id="welcomeImage" src="images/page-1-welcome.png" alt="CALL ME.MOIR - Memories Not Found" />

      <svg style="display:none" aria-hidden="true">
        <defs>
          <path id="four-point-star" d="M50 2 C54 32, 68 46, 98 50 C68 54, 54 68, 50 98 C46 68, 32 54, 2 50 C32 46, 46 32, 50 2 Z" />
        </defs>
      </svg>

      <svg class="sparkle-star star-big-right" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFFFF" />
      </svg>
      <svg class="sparkle-star star-big-left" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFFFF" />
      </svg>
      <svg class="sparkle-star star-med-top" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFDF9" />
      </svg>
      <svg class="sparkle-star star-sm-bottom" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFDF9" />
      </svg>
      <svg class="sparkle-star star-sm-top-left" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#four-point-star" fill="#FFFDF9" />
      </svg>

      <button
        type="button"
        class="tv-screen-trigger"
        id="enterTvBtn"
        aria-label="Masuk ke halaman utama CALL ME.MOIR"
        title="Klik layar TV untuk masuk"
      ></button>
    </div>

    <div class="tap-hint" aria-hidden="true">Tap the TV screen to enter</div>
  </main>

  <!-- PAGE 2 -->
  <section id="page-2" aria-label="CALL ME.MOIR Bio & Packages">
    <div class="bio-sheet">
      <img id="bioImage" src="images/page-2-bio.png" alt="CALL ME.MOIR - Audio Video Guestbook Bio" />

      <!-- Kolom Kiri -->
      <a
        href="https://www.instagram.com/callme.moir/"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-hotspot hotspot-instagram"
        aria-label="Buka Instagram @callme.moir"
      ></a>

      <a
        href="https://www.facebook.com/callme.moir"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-hotspot hotspot-facebook"
        aria-label="Buka Facebook @callme.moir"
      ></a>

      <a
        href="https://www.threads.net/@callme.moir"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-hotspot hotspot-threads"
        aria-label="Buka Threads @callme.moir"
      ></a>

      <!-- Kolom Kanan -->
      <a
        href="https://www.tiktok.com/@callme.moir"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-hotspot hotspot-tiktok"
        aria-label="Buka TikTok @callme.moir"
      ></a>

      <a
        href="mailto:callme.moir@gmail.com"
        class="contact-hotspot hotspot-email"
        aria-label="Kirim email ke callme.moir@gmail.com"
      ></a>

      <a
        href="https://wa.me/6285711888340"
        target="_blank"
        rel="noopener noreferrer"
        class="contact-hotspot hotspot-wa"
        aria-label="Chat WhatsApp 0857-1188-8340"
      ></a>

      <!-- Layar TV Tutorial ke YouTube -->
      <a
        href="https://youtu.be/FAn4UYOu1f0?si=y4sDhiRwwuo-b2Ks"
        target="_blank"
        rel="noopener noreferrer"
        class="tutorial-tv-hotspot"
        aria-label="Tonton Video Tutorial CALL ME.MOIR di YouTube"
      ></a>
    </div>

    <button type="button" class="back-tv-btn" id="backTvBtn" aria-label="Kembali ke halaman Welcome">
      ↩ Welcome
    </button>
  </section>

  <script>
    const page1 = document.getElementById("page-1");
    const page2 = document.getElementById("page-2");
    const enterTvBtn = document.getElementById("enterTvBtn");
    const backTvBtn = document.getElementById("backTvBtn");
    const bioImage = document.getElementById("bioImage");
    const welcomeImage = document.getElementById("welcomeImage");

    const bioCandidates = [
      "images/page-2-bio.png",
      "images/page-2-bio.jpg",
      "page-2-bio.png",
      "images/page-2-bio_2.png",
      "page-2-bio_2.png"
    ];
    let bioIdx = 0;
    bioImage.addEventListener("error", () => {
      bioIdx += 1;
      if (bioIdx < bioCandidates.length) {
        bioImage.src = bioCandidates[bioIdx];
      }
    });

    const welcomeCandidates = [
      "images/page-1-welcome.png",
      "images/page-1-welcome.jpg",
      "page-1-welcome.png"
    ];
    let welcomeIdx = 0;
    welcomeImage.addEventListener("error", () => {
      welcomeIdx += 1;
      if (welcomeIdx < welcomeCandidates.length) {
        welcomeImage.src = welcomeCandidates[welcomeIdx];
      }
    });

    enterTvBtn.addEventListener("click", () => {
      page2.classList.add("active");
      page1.style.display = "none";
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    backTvBtn.addEventListener("click", () => {
      page1.style.display = "flex";
      page2.classList.remove("active");
      window.scrollTo({ top: 0, behavior: "instant" });
    });
  </script>
</body>
</html>
