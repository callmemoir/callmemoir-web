<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CALL ME.MOIR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #F4EBE2;
      color: #F0E5D8;
      font-family: Georgia, serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* PAGE 1: Layar TV Interaktif + Efek Blink */
    #page-1 {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      background-color: #F4EBE2;
    }

    .tv-stage {
      position: relative;
      width: 100%;
      max-width: 1020px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      background-color: #F4EBE2;
    }

    .tv-stage img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Efek bintang blink bergerak di atas desain */
    .sparkle {
      position: absolute;
      pointer-events: none;
      color: #FFFFFF;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.95), 0 0 24px rgba(255, 245, 225, 0.85);
      animation: twinkleBlink 1.8s infinite ease-in-out;
    }

    .sparkle-1 {
      top: 24%;
      left: 65.5%;
      font-size: clamp(22px, 3.6vw, 44px);
      animation-delay: 0s;
    }

    .sparkle-2 {
      top: 61%;
      left: 15.8%;
      font-size: clamp(20px, 3.2vw, 40px);
      animation-delay: 0.6s;
    }

    .sparkle-3 {
      top: 32%;
      left: 75%;
      font-size: clamp(14px, 2vw, 24px);
      animation-delay: 1.1s;
    }

    .sparkle-4 {
      top: 56%;
      left: 25.2%;
      font-size: clamp(13px, 1.8vw, 22px);
      animation-delay: 0.3s;
    }

    @keyframes twinkleBlink {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.72) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.22) rotate(12deg);
      }
    }

    /* Area klik tepat di layar TV + kedip layar halus */
    .tv-screen-trigger {
      position: absolute;
      top: 23%;
      left: 24.2%;
      width: 47.8%;
      height: 61.5%;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 18px;
      animation: screenPulse 2.4s infinite ease-in-out;
      transition: background-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes screenPulse {
      0%, 100% {
        box-shadow: inset 0 0 0 rgba(255, 255, 255, 0);
        background-color: rgba(255, 255, 255, 0);
      }
      50% {
        box-shadow: inset 0 0 26px rgba(255, 255, 255, 0.38);
        background-color: rgba(255, 255, 255, 0.08);
      }
    }

    .tv-screen-trigger:hover,
    .tv-screen-trigger:focus-visible {
      background-color: rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 0 32px rgba(255, 255, 255, 0.45);
      outline: none;
    }

    .tv-screen-trigger:active {
      transform: scale(0.992);
    }

    /* PAGE 2: Halaman Utama / Bio */
    #page-2 {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 56px;
      background-color: #F4EBE2;
      animation: fadeEnter 0.55s ease forwards;
    }

    #page-2.active {
      display: flex;
    }

    .bio-sheet {
      width: 100%;
      max-width: 780px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
      background-color: #F4EBE2;
    }

    .bio-sheet img {
      display: block;
      width: 100%;
      height: auto;
    }

    .back-tv-btn {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(240, 229, 216, 0.45);
      background-color: rgba(74, 24, 22, 0.92);
      color: #F0E5D8;
      font-family: Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.4px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .back-tv-btn:hover {
      transform: translateY(-2px);
    }

    @keyframes fadeEnter {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <!-- PAGE 1 -->
  <main id="page-1" aria-label="Welcome Screen">
    <div class="tv-stage">
      <img src="page-1-welcome.png" alt="CALL ME.MOIR - Memories Not Found" />

      <!-- Bintang berkedip / blink -->
      <span class="sparkle sparkle-1" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-2" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-3" aria-hidden="true">✦</span>
      <span class="sparkle sparkle-4" aria-hidden="true">✦</span>

      <button
        type="button"
        class="tv-screen-trigger"
        id="enterTvBtn"
        aria-label="Masuk ke halaman utama CALL ME.MOIR"
        title="Klik layar TV untuk masuk"
      ></button>
    </div>
  </main>

  <!-- PAGE 2 -->
  <section id="page-2" aria-label="CALL ME.MOIR Bio & Packages">
    <div class="bio-sheet">
      <img src="page-2-bio.png" alt="CALL ME.MOIR - Audio Video Guestbook Bio" />
    </div>
    <button type="button" class="back-tv-btn" id="backTvBtn" aria-label="Kembali ke layar TV">
      ↩ Layar TV
    </button>
  </section>

  <script>
    const page1 = document.getElementById("page-1");
    const page2 = document.getElementById("page-2");
    const enterTvBtn = document.getElementById("enterTvBtn");
    const backTvBtn = document.getElementById("backTvBtn");

    enterTvBtn.addEventListener("click", () => {
      page2.classList.add("active");
      page1.style.display = "none";
      window.scrollTo({ top: 0, behavior: "instant" });
    });

    backTvBtn.addEventListener("click", () => {
      page1.style.display = "flex";
      page2.classList.remove("active");
      window.scrollTo({ top: 0, behavior: "instant" });
    });
  </script>
</body>
</html>
